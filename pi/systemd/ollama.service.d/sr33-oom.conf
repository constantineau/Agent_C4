# Drop-in for ollama.service (#248): if the Orin runs out of memory anyway, the kernel's OOM killer
# takes Ollama (narration, the first thing to shed) before the copilot, re-route, plume, the shed
# guard, sshd or tailscaled. Ollama restarts itself (Restart=always) and the copilot falls back to
# the engine's text meanwhile.
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp pi/systemd/ollama.service.d/sr33-oom.conf /etc/systemd/system/ollama.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
[Service]
OOMScoreAdjust=500
