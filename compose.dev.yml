# Agent_C4 development stack. Separate DB + ports from prod; safe to tear down.
#   docker compose -f compose.dev.yml up -d --build
# Project, database and volume names default to neutral c4-* names for a new install. An existing
# install pins its own in .env (C4_DEV_PROJECT, C4_DEV_PGDATA, POSTGRES_DB/USER; see .env.example)
# so a rebuild keeps the same containers, volumes and database (#314). Not COMPOSE_PROJECT_NAME:
# dev and prod read the same .env.
name: ${C4_DEV_PROJECT:-c4-dev}

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-c4}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-c4_dev}
    # localhost only. Note: ufw does not filter Docker-published ports, so never publish on 0.0.0.0.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # migrations in this dir run in filename order on first init
      - ./vps/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-c4} -d ${POSTGRES_DB:-c4_dev}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ingestion:
    build:
      context: .
      dockerfile: vps/ingestion/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      INGEST_TOKEN: ${INGEST_TOKEN:-dev-ingest-token}
    # localhost + Tailscale only: the boat's uplink posts to this host's Tailscale address :8101.
    # VPS_TAILNET_IP (in .env) is that address; never 0.0.0.0 (ufw does not filter Docker ports).
    ports:
      - "127.0.0.1:8101:8000"
      - "${VPS_TAILNET_IP:?set VPS_TAILNET_IP in .env (this host's Tailscale address)}:8101:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: vps/agent/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      BOAT_ID: ${BOAT_ID:?set BOAT_ID in .env (this boat's id)}
      BOAT_PASSWORD: ${BOAT_PASSWORD:?set BOAT_PASSWORD in .env}   # shared crew web password, no default
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      RACE_MODE_DEFAULT: ${RACE_MODE_DEFAULT:-practice}   # 9.2 gate: dev opens; prod omits -> fail-closed 'race'
    ports:
      - "127.0.0.1:8102:8000"
      - "${VPS_TAILNET_IP:?set VPS_TAILNET_IP in .env (this host's Tailscale address)}:8102:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: vps/web/Dockerfile
    environment:
      # nginx templates these into the served config
      AGENT_HOST: agent
      AGENT_PORT: "8000"
    ports:
      - "127.0.0.1:8090:80"
      - "${VPS_TAILNET_IP:?set VPS_TAILNET_IP in .env (this host's Tailscale address)}:8090:80"
    depends_on:
      - agent
    restart: unless-stopped

  # C4 Performance Lab (cloud) — the browser-based prep/debrief surface. Serves the Lab web
  # shell + the race-library API from one container. No DB dependency yet (race definitions are
  # JSON artifacts: bundled in the image + ingested ones on the lab_ingested volume).
  lab:
    build:
      context: .
      dockerfile: vps/lab/Dockerfile
    environment:
      LAB_PASSWORD: ${LAB_PASSWORD:-lab-dev}
      LAB_AUTH_ENABLED: ${LAB_AUTH_ENABLED:-true}
      AGENT_URL: ${AGENT_URL:-http://agent:8000}        # Monitor: our-boat telemetry from the cloud agent
      BOAT_PASSWORD: ${BOAT_PASSWORD:?set BOAT_PASSWORD in .env}   # to auth to the agent for /conditions
      DEPLOY_BOAT_ID: ${DEPLOY_BOAT_ID:?set DEPLOY_BOAT_ID in .env (the boat Deploy pushes to)}
      # that boat's Pi engine over Tailscale (http://<pi-tailnet-ip>:8200). Unset: Deploy, the boat
      # read and the plume push say so and send nothing (#314: no address in code).
      DEPLOY_PI_ENGINE_URL: ${DEPLOY_PI_ENGINE_URL:-}
      DEPLOY_COPILOT_URL: ${DEPLOY_COPILOT_URL:-}     # default: the engine's host :8091/copilot
      DEPLOY_PI_HOST: ${DEPLOY_PI_HOST:-}             # ssh target shown in the manual-load commands
      DEPLOY_PI_ENGINE: ${DEPLOY_PI_ENGINE:-http://localhost:8200}   # engine URL as seen from the Pi, for the manual-load commands
      PLUME_PUSH_URL: ${PLUME_PUSH_URL:-}
      # the boat library (#320): the Pi pulls GET /api/boats/library with its ingest token
      INGEST_TOKEN: ${INGEST_TOKEN:-dev-ingest-token}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}        # race-doc ingestion (Opus extraction)
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}          # single-model knob (extract/judge)
      ANTHROPIC_MODEL_CHAIN: ${ANTHROPIC_MODEL_CHAIN:-claude-fable-5-1,claude-opus-5}  # every Lab LLM call but race import: Fable 5.1 primary, Opus 5 fallback
      ANTHROPIC_IMPORT_MODEL_CHAIN: ${ANTHROPIC_IMPORT_MODEL_CHAIN:-claude-opus-5-5,claude-fable-5-1}  # race import (NOR/SI extraction) only: Opus 5.5 first
      COASTLINE_CACHE: /srv/coastline       # Lab obstacle avoidance: cached coastline polygons
      COASTLINE_SOURCE: ${COASTLINE_SOURCE:-natural_earth}  # natural_earth | enc (NOAA S-57, draft-aware)
      COASTLINE_GLOBAL: ${COASTLINE_GLOBAL:-gshhg}  # global backstop dataset: gshhg (full-res) | natural_earth
      GSHHG_RES: ${GSHHG_RES:-f}            # GSHHG resolution f(ull)|h|i|l|c — full = all sub-nm islands
      ENC_CACHE: /srv/enc                   # NOAA ENC cells + extracted GeoJSON (prep-time GDAL)
      DEPTH_GRIDS: ${DEPTH_GRIDS:-}         # depth grids: empty = built-in; "default,etopo" adds the world grid (#309)
      PLAYBOOK_DIR: /srv/playbooks          # Lab-2b: frozen, signed playbook bundles (onboard homework)
      # forecast plume: every router model along the planned route, one snapshot per new cycle
      # (48 h kept). PLUME_PUSH=1 also sends it to the Pi engine's POST /plume/load (the Deploy
      # push's line) — off by default: writing to the boat needs the owner's go at deploy time.
      # Never recorded or sent for a race once its start has passed; the boat also refuses a plume
      # while its race log has a race session running.
      PLUME_DIR: /srv/plume
      PLUME_RECORDER: ${PLUME_RECORDER:-1}
      PLUME_PUSH: ${PLUME_PUSH:-0}
      SHARE_DIR: /srv/shares                # public read-only route-player share bundles
      LAB_PUBLIC_URL: ${LAB_PUBLIC_URL:-https://lab.racertracer.net}  # base for /share links (PDF QR)
      LEARNING_DB: /srv/learning/learning.db  # Lab-4: ongoing performance archive + refinement proposals
      RETRO_DB: /srv/retro/retro.db           # fleet-retro persistent archive (docs/RETRO_STUDY.md)
      RETRO_GRIB_DIR: /srv/retro/grib         # pinned GRIB artifacts — durable, never cache-evicted
      BOAT_DRAFT_M: ${BOAT_DRAFT_M:-2.1336}  # active boat draft (m); SR33 = 7 ft → ENC depth no-go
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}        # feedback widget → GitHub issues (dedicated fine-grained PAT)
      GITHUB_REPO: ${GITHUB_REPO:-constantineau/Agent_C4}
      FEEDBACK_ALLOW_ORIGINS: ${FEEDBACK_ALLOW_ORIGINS:-https://c4.racertracer.net,https://lab.racertracer.net,http://localhost:8091}
    ports:
      - "127.0.0.1:8103:8000"
      - "${VPS_TAILNET_IP:?set VPS_TAILNET_IP in .env (this host's Tailscale address)}:8103:8000"
    volumes:
      - lab_ingested:/srv/ingested
      - lab_gribcache:/srv/gribcache        # Lab-1: cached GRIB subsets (cheap re-runs/members)
      - lab_coastline:/srv/coastline        # land/lake polygons for obstacle avoidance (fetched once)
      - lab_enc:/srv/enc                    # NOAA ENC S-57 cells + extracted GeoJSON (cached)
      - lab_playbooks:/srv/playbooks        # Lab-2b: frozen signed playbook bundles
      - lab_learning:/srv/learning          # Lab-4: ongoing performance archive (SQLite)
      - lab_retro:/srv/retro                # fleet-retro archive: SQLite + pinned GRIBs
      - lab_shares:/srv/shares              # route-player share bundles (frozen snapshots)
      - lab_plume:/srv/plume                # forecast-plume run history (a few KB per model run)
    restart: unless-stopped

volumes:
  # The database files. Named explicitly: the volume's name must not follow its key or the project,
  # or a rename would start the database on a new, empty volume. An existing install pins it.
  pgdata:
    name: ${C4_DEV_PGDATA:-c4-dev_pgdata}
  lab_ingested:
  lab_gribcache:
  lab_coastline:
  lab_enc:
  lab_playbooks:
  lab_learning:
  lab_retro:
  lab_shares:
  lab_plume:
