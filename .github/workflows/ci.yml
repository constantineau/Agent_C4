name: CI
# Runs `make ci` and nothing else, so the Makefile stays the only definition of the checks.
# Each test runs in a container built from the service's Dockerfile (tools/ci/run.sh), so the
# runner needs only Docker.
on:
  push: { branches: [dev, main] }
  pull_request: { branches: [dev, main] }
  workflow_dispatch:
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: make ci
