<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>C4 Performance Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Saira:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/leaflet.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- shared team login -->
  <div id="gate" class="gate">
    <!-- a real form so Return / Go on the iPad keyboard signs in -->
    <form class="gatebox" onsubmit="event.preventDefault(); unlock();">
      <h1>C4 Performance Lab</h1>
      <p class="sub">Race prep and debrief. Team login.</p>
      <div class="pw-row">
        <input id="pw" type="password" placeholder="Team password" autocomplete="current-password"
          autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
        <button type="button" id="pwShow" class="ghost" aria-pressed="false" aria-controls="pw"
          onclick="pwToggle()">Show</button>
      </div>
      <button type="submit">Enter</button>
      <div id="gateErr" class="err" role="alert"></div>
    </form>
  </div>

  <header class="topbar">
    <div class="brand"><span class="mark">C4</span><span class="wl">Performance&nbsp;Lab</span></div>
    <nav class="tabs" id="tabs">
      <a href="#races" data-phase="prep">Races</a>
      <a href="#venue" data-phase="prep">Venue study</a>
      <a href="#course" data-phase="prep">Course &amp; Marks</a>
      <a href="#rules" data-phase="prep">Rules &amp; Checklist</a>
      <a href="#fleet" data-phase="prep">Fleet</a>
      <a href="#learnings" data-phase="prep">Learnings</a>
      <a href="#gameplan" data-phase="prep">Gameplan</a>
      <a href="#deploy" data-phase="prep">Lock-in &amp; Deploy</a>
      <a href="#monitor" data-phase="race">Monitor</a>
      <a href="#debrief" data-phase="debrief">Debrief</a>
      <a href="#polar" data-phase="debrief">Polar</a>
    </nav>
    <button class="ghost" onclick="logout()">Sign out</button>
  </header>

  <main id="view"><div class="loading">Loading…</div></main>

  <!-- a new Lab build is out (#325, app.js checkWebVersion): one tap reloads -->
  <button id="verbar" class="verbar" hidden onclick="location.reload()">New version. Reload</button>

  <!-- unsaved-edits bar: shown while the race definition has edits that aren't saved (app.js syncDirty) -->
  <div id="savebar" class="savebar" role="status" aria-live="polite" hidden>
    <span class="savebar-dot" aria-hidden="true">●</span>
    <span id="savebarText" class="savebar-text">Unsaved changes</span>
    <span id="savebarBtns" class="savebar-btns">
      <button class="ghost" onclick="savebarDiscard()">Discard</button>
      <button id="savebarSave" class="primary" onclick="savebarSave()">Save</button>
    </span>
  </div>

  <script src="/vendor/leaflet.js"></script>
  <script src="/mapview.js"></script>
  <script src="/plume.js"></script>
  <script src="/monitor-geo.js"></script>
  <script src="/app.js"></script>
  <script src="/venuestudy.js"></script>
  <script>window.FEEDBACK_CFG = { endpoint: "/api/feedback", source: "lab" };</script>
  <script src="/feedback.js"></script>
</body>
</html>
